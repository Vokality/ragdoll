<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent progress regression</title>
  </head>
  <body>
    <p id="result">Running…</p>
    <div id="root" style="width: 400px; height: 450px; display: flex"></div>
    <script type="module">
      import React, { act, useSyncExternalStore } from "react";
      import { createRoot } from "react-dom/client";
      import { ChatService } from "../src/application/chat-service.ts";
      import { ConversationBubbles } from "../src/components/conversation-bubbles.tsx";
      import "../src/styles/global.css";
      globalThis.IS_REACT_ACT_ENVIRONMENT = true;
      let handlers;
      const done = Promise.withResolvers();
      const gateway = {
        fetchSettings: async () => ({ theme: "default", variant: "human" }),
        fetchConversation: async () => [],
        subscribeToStreaming: (value) => {
          handlers = value;
          return () => {};
        },
        sendMessage: () => done.promise,
      };
      const service = new ChatService(gateway, {
        theme: "default",
        variant: "human",
      });
      function Sample() {
        const state = useSyncExternalStore(
          service.subscribe,
          service.getSnapshot,
        );
        return React.createElement(
          "div",
          {
            style: { display: "flex", flexDirection: "column", width: "100%" },
          },
          React.createElement(
            "div",
            { role: "status" },
            state.isLoading ? "Thinking" : "Idle",
          ),
          React.createElement(ConversationBubbles, {
            messages: state.visibleMessages,
            isStreaming: state.isStreaming,
          }),
        );
      }
      const root = createRoot(document.getElementById("root"));
      const user = { id: "user", role: "user", content: "Search" };
      const ack = {
        id: "ack",
        role: "assistant",
        content: "I'll look that up.",
        phase: "commentary",
      };
      const answer = {
        id: "answer",
        role: "assistant",
        content: "Here is the answer.",
        phase: "final_answer",
        sources: [{ title: "Source", url: "https://example.com/" }],
      };
      const check = (ok, message) => {
        if (!ok) throw new Error(message);
      };
      try {
        await service.start();
        await act(async () => root.render(React.createElement(Sample)));
        let turn;
        await act(async () => {
          turn = service.sendMessage("Search");
          handlers.onConversationChanged([user]);
          handlers.onText(ack.content, ack.id);
          handlers.onConversationChanged([user, ack]);
        });
        check(
          document.querySelector('[role="status"]').textContent === "Thinking",
          "Progress ended the busy state",
        );
        check(
          document.querySelectorAll(".bubble-assistant").length === 1,
          "Acknowledgment duplicated",
        );
        check(
          document
            .querySelector(".bubble-assistant")
            .textContent.includes(ack.content),
          "Acknowledgment missing while work is pending",
        );
        await act(async () => {
          handlers.onText(answer.content, answer.id);
        });
        const streamingBubble =
          document.querySelectorAll(".bubble-assistant")[1];
        await act(async () => {
          handlers.onConversationChanged([user, ack, answer]);
          handlers.onStreamEnd();
          done.resolve({ success: true });
          await turn;
        });
        check(
          document.querySelector('[role="status"]').textContent === "Idle",
          "Final turn never ended",
        );
        const bubbles = document.querySelectorAll(".bubble-assistant");
        check(
          bubbles[1] === streamingBubble,
          "Persisting the stream remounted its bubble",
        );
        check(bubbles.length === 2, "Final answer merged with acknowledgment");
        check(
          bubbles[0].textContent === ack.content,
          "Acknowledgment changed during final answer",
        );
        check(
          !bubbles[0].querySelector(".source-pill") &&
            bubbles[1].querySelector(".source-pill"),
          "Sources attached to wrong message",
        );
        await act(async () => root.unmount());
        service.stop();
        document.getElementById("result").textContent =
          "PASS: separate progress and final messages, busy lifecycle, and source ownership";
      } catch (error) {
        document.getElementById("result").textContent = "FAIL: " + error.stack;
      }
    </script>
  </body>
</html>
