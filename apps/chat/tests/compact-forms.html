<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Compact forms regression</title>
    <style>
      input,
      select {
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <p
      id="result"
      style="position: fixed; bottom: 0; pointer-events: none; z-index: 100"
    >
      Running…
    </p>
    <div id="root" style="width: 400px; height: 600px"></div>
    <script type="module">
      import React, { act } from "react";
      import { createRoot } from "react-dom/client";
      import { SetupScreen } from "../src/screens/setup-screen.tsx";
      import { ExtensionConfigModal } from "../src/components/extension-config-modal.tsx";
      import "../src/styles/global.css";
      globalThis.IS_REACT_ACT_ENVIRONMENT = true;
      const root = createRoot(document.getElementById("root"));
      const check = (ok, message) => {
        if (!ok) throw new Error(message);
      };
      const setup = {
        listProviders: async () => [
          {
            id: "openai",
            name: "OpenAI",
            model: "gpt-5.6-sol",
            apiKeyUrl: "https://platform.openai.com/api-keys",
            keyPlaceholder: "sk-...",
            configured: false,
            selected: true,
          },
        ],
        configureApiKey: async () => ({
          success: false,
          error: "Example validation failure",
        }),
        openApiKeyPage: async () => ({ success: true }),
      };
      try {
        await act(async () =>
          root.render(
            React.createElement(SetupScreen, {
              service: setup,
              onComplete: () => {},
              reportError: (error) => {
                throw error;
              },
            }),
          ),
        );
        const input = document.querySelector("input");
        check(
          input.labels[0]?.textContent === "OpenAI API key",
          "Key field has no visible label",
        );
        await act(async () => {
          Object.getOwnPropertyDescriptor(
            HTMLInputElement.prototype,
            "value",
          ).set.call(input, "sk-example-key-for-local-ui-test");
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
        const reveal = document.querySelector('[aria-label="Show API key"]');
        check(
          reveal.tabIndex >= 0,
          "Reveal control is excluded from keyboard navigation",
        );
        await act(async () => reveal.click());
        check(
          input.type === "text" &&
            reveal.getAttribute("aria-pressed") === "true",
          "Reveal state is incorrect",
        );
        await act(async () =>
          document
            .querySelector("form")
            .dispatchEvent(
              new Event("submit", { bubbles: true, cancelable: true }),
            ),
        );
        check(
          document.querySelector("input") === input,
          "Validation failure recreated the input",
        );
        check(
          input.value === "sk-example-key-for-local-ui-test",
          "Validation failure erased input",
        );
        check(
          input.getAttribute("aria-invalid") === "true",
          "Invalid input is not announced",
        );
        const alert = document.querySelector('[role="alert"]');
        check(
          input.getAttribute("aria-describedby").split(" ").includes(alert.id),
          "Error is not associated with the input",
        );
        const container = document.getElementById("root").firstElementChild;
        check(
          [...container.querySelectorAll("input, button, .card")].every(
            (element) => {
              const bounds = element.getBoundingClientRect();
              const outer = container.getBoundingClientRect();
              return bounds.left >= outer.left && bounds.right <= outer.right;
            },
          ),
          "Setup overflows horizontally",
        );
        check(
          container.querySelector("canvas").getBoundingClientRect().top >= 0,
          "Setup starts above its scrollable area",
        );
        container.scrollTop = container.scrollHeight;
        check(
          [...container.querySelectorAll("button")]
            .at(-1)
            .getBoundingClientRect().bottom <=
            container.getBoundingClientRect().bottom,
          "Setup help is unreachable at compact height",
        );

        const pending = Promise.withResolvers();
        const service = {
          loadConfiguration: () => pending.promise,
          saveConfiguration: async (_extensionId, values) => ({
            configuration: {
              ...(await pending.promise),
              status: { isConfigured: true, missingFields: [], values },
              values,
            },
            oauth: { status: "disconnected", isAuthenticated: false },
          }),
          getOAuthState: async () => ({
            status: "disconnected",
            isAuthenticated: false,
          }),
          onOAuthConnected: () => () => {},
          onOAuthFailed: () => () => {},
        };
        await act(async () =>
          root.render(
            React.createElement(ExtensionConfigModal, {
              isOpen: true,
              onClose: () => {},
              extensionId: "example",
              extensionName: "Example",
              hasConfig: true,
              hasOAuth: true,
              service,
            }),
          ),
        );
        check(
          document.querySelector('[role="status"]')?.textContent ===
            "Loading settings…",
          "Configuration has no loading feedback",
        );
        check(
          [...document.querySelectorAll("button")].find(
            (b) => b.textContent === "Connect account",
          )?.disabled,
          "Connect is available before loading finishes",
        );
        await act(async () =>
          pending.resolve({
            schema: {
              name: {
                type: "string",
                label: "Name",
                description: "Your display name",
                required: true,
              },
              count: {
                type: "number",
                label: "Count",
                description: "Number of items",
                required: true,
              },
              mode: {
                type: "select",
                label: "Mode",
                description: "Choose a mode",
                required: true,
                options: [{ value: "daily", label: "Daily" }],
              },
              enabled: {
                type: "boolean",
                label: "Enabled",
                description: "Enable this feature",
              },
            },
            status: {
              isConfigured: false,
              missingFields: ["name", "count", "mode"],
              values: {},
            },
            values: {},
          }),
        );
        for (const field of document.querySelectorAll(
          "input, select, [role=switch]",
        )) {
          check(
            document.querySelector(`label[for="${field.id}"]`),
            "Configuration control has no label",
          );
          check(
            document.getElementById(field.getAttribute("aria-describedby")),
            "Configuration description is not associated",
          );
        }
        check(
          !document.querySelector('[role="status"]'),
          "Loading feedback did not clear",
        );
        const colorProbe = document.createElement("span");
        document.body.append(colorProbe);
        const resolvedColor = (token) => {
          colorProbe.style.color = `var(${token})`;
          return getComputedStyle(colorProbe).color;
        };
        const controls = [...document.querySelectorAll("input, select")];
        check(controls.length === 3, "Missing configuration controls");
        for (const field of controls) {
          check(
            field.getAttribute("aria-invalid") === "true",
            `${field.type} does not announce its missing value`,
          );
          check(
            getComputedStyle(field).borderTopColor === resolvedColor("--error"),
            `${field.type} is missing its visible validation border`,
          );
          await act(async () => {
            Object.getOwnPropertyDescriptor(
              Object.getPrototypeOf(field),
              "value",
            ).set.call(field, field.type === "number" ? "3" : "daily");
            field.dispatchEvent(
              new Event(
                field instanceof HTMLSelectElement ? "change" : "input",
                { bubbles: true },
              ),
            );
          });
        }
        await act(async () =>
          [...document.querySelectorAll("button")]
            .find((button) => button.textContent === "Save Configuration")
            .click(),
        );
        for (const field of controls) {
          check(
            field.isConnected && field.getAttribute("aria-invalid") !== "true",
            `${field.type} retained its invalid state after saving`,
          );
          check(
            getComputedStyle(field).borderTopColor ===
              resolvedColor("--border"),
            `${field.type} did not restore its normal border after saving`,
          );
        }
        colorProbe.remove();
        document.getElementById("result").textContent =
          "PASS: compact setup, key validation recovery, keyboard reveal, configuration loading and labels, and string/number/select validation borders and recovery";
      } catch (error) {
        document.getElementById("result").textContent =
          `FAIL: ${error.message}`;
        throw error;
      } finally {
        await act(async () => root.unmount());
      }
    </script>
  </body>
</html>
