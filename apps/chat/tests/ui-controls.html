<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shared UI controls regression</title>
  </head>
  <body>
    <p id="result">Running…</p>
    <div id="root" style="width: 340px"></div>
    <script type="module">
      import React, { act, StrictMode, createRef } from "react";
      import { createRoot } from "react-dom/client";
      import { Button, IconButton } from "../src/components/ui/button.tsx";
      import { Field } from "../src/components/ui/field.tsx";
      import {
        TextInput,
        Textarea,
        Select,
        Checkbox,
      } from "../src/components/ui/input.tsx";
      import { Switch } from "../src/components/ui/switch.tsx";
      import "../src/styles/global.css";

      globalThis.IS_REACT_ACT_ENVIRONMENT = true;
      const root = createRoot(document.getElementById("root"));
      const check = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const inputRef = createRef();
      const textareaRef = createRef();
      const selectRef = createRef();
      const checkboxRef = createRef();
      const buttonRef = createRef();
      let submissions = 0,
        actions = 0,
        changes = 0;
      let checked = false,
        disabled = false,
        loading = false,
        error = "Name is required";
      let text = "Sam",
        notes = "A note",
        option = "one",
        accepted = false,
        key = "";
      const render = () =>
        root.render(
          React.createElement(
            StrictMode,
            null,
            React.createElement(
              "form",
              {
                onSubmit: (event) => {
                  event.preventDefault();
                  submissions++;
                },
              },
              React.createElement(
                Field,
                {
                  label: "Name",
                  required: true,
                  description: "Use your preferred name",
                  error,
                },
                (control) =>
                  React.createElement(
                    "div",
                    null,
                    React.createElement(TextInput, {
                      ...control,
                      ref: inputRef,
                      required: true,
                      value: text,
                      onChange: (event) => {
                        text = event.currentTarget.value;
                        render();
                      },
                    }),
                    React.createElement(
                      IconButton,
                      {
                        "aria-label": "Clear name",
                        onClick: () => {
                          text = "";
                          render();
                        },
                      },
                      "×",
                    ),
                  ),
              ),
              React.createElement(Field, { label: "Notes" }, (control) =>
                React.createElement(Textarea, {
                  ...control,
                  ref: textareaRef,
                  value: notes,
                  onChange: (event) => {
                    notes = event.currentTarget.value;
                    render();
                  },
                  onKeyDown: (event) => {
                    key = event.key;
                  },
                }),
              ),
              React.createElement(
                Field,
                {
                  label: "Choice",
                  description: "Choose one",
                  descriptionPosition: "before",
                },
                (control) =>
                  React.createElement(
                    Select,
                    {
                      ...control,
                      ref: selectRef,
                      value: option,
                      onChange: (event) => {
                        option = event.currentTarget.value;
                        render();
                      },
                    },
                    React.createElement("option", { value: "one" }, "One"),
                    React.createElement("option", { value: "two" }, "Two"),
                  ),
              ),
              React.createElement(
                "label",
                null,
                React.createElement(Checkbox, {
                  ref: checkboxRef,
                  checked: accepted,
                  onChange: (event) => {
                    accepted = event.currentTarget.checked;
                    render();
                  },
                }),
                "Accept",
              ),
              React.createElement(Field, { label: "Check-ins" }, (control) =>
                React.createElement(Switch, {
                  ...control,
                  checked,
                  disabled,
                  "aria-label": "Check-ins",
                  onCheckedChange: (value) => {
                    checked = value;
                    changes++;
                    render();
                  },
                }),
              ),
              React.createElement(
                Button,
                {
                  ref: buttonRef,
                  id: "action",
                  className: "custom-action",
                  variant: "primary",
                  loading,
                  loadingLabel: "Saving…",
                  disabled,
                  onClick: () => actions++,
                },
                "Save",
              ),
              React.createElement(
                Button,
                { id: "submit", type: "submit" },
                "Submit",
              ),
            ),
          ),
        );

      const changeValue = async (element, value) => {
        const setter = Object.getOwnPropertyDescriptor(
          Object.getPrototypeOf(element),
          "value",
        ).set;
        await act(async () => {
          setter.call(element, value);
          element.dispatchEvent(
            new Event(
              element instanceof HTMLSelectElement ? "change" : "input",
              { bubbles: true },
            ),
          );
        });
      };
      try {
        await act(async () => render());
        check(
          inputRef.current instanceof HTMLInputElement &&
            textareaRef.current instanceof HTMLTextAreaElement &&
            selectRef.current instanceof HTMLSelectElement &&
            buttonRef.current instanceof HTMLButtonElement,
          "Refs must expose native elements",
        );
        const input = inputRef.current;
        const stableId = input.id;
        check(
          input.labels.length === 1 && input.labels[0].control === input,
          "Wrapped input lost its visible label",
        );
        check(
          document.querySelector('[aria-label="Clear name"]').id !== input.id,
          "Adjacent icon must not acquire the field identity",
        );
        const described = input
          .getAttribute("aria-describedby")
          .split(" ")
          .map((id) => document.getElementById(id));
        check(
          described.length === 2 &&
            described.every(Boolean) &&
            described[1].textContent === error,
          "Hint and error must both describe the actual input",
        );
        check(
          input.getAttribute("aria-invalid") === "true" &&
            input.getAttribute("aria-required") === "true",
          "Required/error semantics did not reach the input",
        );
        input.labels[0].click();
        check(
          document.activeElement === input,
          "Clicking label did not focus its wrapped control",
        );
        await changeValue(input, "Alex");
        await changeValue(textareaRef.current, "Updated note");
        await changeValue(selectRef.current, "two");
        await act(async () => checkboxRef.current.click());
        textareaRef.current.dispatchEvent(
          new KeyboardEvent("keydown", { key: "Enter", bubbles: true }),
        );
        check(
          text === "Alex" &&
            notes === "Updated note" &&
            option === "two" &&
            accepted &&
            key === "Enter",
          "Native input/change/keyboard events were not forwarded",
        );
        error = null;
        await act(async () => render());
        check(
          inputRef.current === input &&
            input.id === stableId &&
            !input.hasAttribute("aria-invalid"),
          "Clearing an error remounted the input or left invalid state",
        );
        check(
          input.getAttribute("aria-describedby").split(" ").length === 1 &&
            !document.getElementById(`${stableId}-error`),
          "Cleared error left an orphaned description",
        );
        const toggle = document.querySelector('[role="switch"]');
        check(
          toggle.getAttribute("aria-checked") === "false" &&
            toggle.labels.length === 1,
          "Switch must expose its state and label",
        );
        await act(async () => toggle.click());
        check(
          checked &&
            changes === 1 &&
            toggle.getAttribute("aria-checked") === "true",
          "Switch did not publish the next checked value",
        );
        await act(async () => buttonRef.current.click());
        check(
          actions === 1 && submissions === 0,
          "Default button accidentally submitted the form",
        );
        loading = true;
        await act(async () => render());
        buttonRef.current.click();
        check(
          actions === 1 &&
            buttonRef.current.disabled &&
            buttonRef.current.getAttribute("aria-busy") === "true",
          "Loading button allowed duplicate activation or lacked busy state",
        );
        check(
          buttonRef.current.textContent === "Saving…" &&
            buttonRef.current.querySelector('.spinner-sm[aria-hidden="true"]'),
          "Loading label or decorative spinner missing",
        );
        check(
          buttonRef.current.classList.contains("btn-primary") &&
            buttonRef.current.classList.contains("custom-action"),
          "Button discarded variant or caller styling",
        );
        loading = false;
        disabled = true;
        await act(async () => render());
        buttonRef.current.click();
        toggle.click();
        check(
          actions === 1 && changes === 1 && buttonRef.current.disabled,
          "Explicit disabled state was lost after loading finished",
        );
        disabled = false;
        await act(async () => render());
        await act(async () => document.getElementById("submit").click());
        check(submissions === 1, "Explicit submit button lost form behavior");
        check(
          document.getElementById("root").scrollWidth <= 340,
          "Shared controls overflow compact layout",
        );
        await act(async () => root.unmount());
        check(
          inputRef.current === null && buttonRef.current === null,
          "Native refs were not cleared on unmount",
        );
        document.getElementById("result").textContent =
          "PASS: native refs/events, wrapped field labels and descriptions, error recovery, switch state, loading/disabled actions and form semantics";
      } catch (error) {
        document.getElementById("result").textContent =
          `FAIL: ${error.stack || error}`;
      }
    </script>
  </body>
</html>
