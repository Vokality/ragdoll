<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Provider setup regression</title>
  </head>
  <body>
    <p id="result">Running…</p>
    <div id="root" style="width: 400px; height: 600px"></div>
    <script type="module">
      import React, { act } from "react";
      import { createRoot } from "react-dom/client";
      import { SetupScreen } from "../src/screens/setup-screen.tsx";
      import "../src/styles/global.css";
      globalThis.IS_REACT_ACT_ENVIRONMENT = true;
      const root = createRoot(document.getElementById("root"));
      const check = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      let providers = [
        {
          id: "openai",
          name: "OpenAI",
          model: "gpt-5.6-sol",
          apiKeyUrl: "https://platform.openai.com/api-keys",
          keyPlaceholder: "sk-...",
          selected: true,
          configured: true,
        },
        {
          id: "grok",
          name: "Grok",
          model: "grok-4.6",
          apiKeyUrl: "https://console.x.ai/",
          keyPlaceholder: "xai-...",
          selected: false,
          configured: true,
        },
      ];
      const configured = [],
        selected = [],
        removed = [],
        opened = [];
      let completed = 0;
      const service = {
        listProviders: async () => structuredClone(providers),
        configureApiKey: async (provider, key) => {
          configured.push({ provider, key });
          return { success: false, error: "Invalid API key" };
        },
        selectProvider: async (provider) => {
          selected.push(provider);
          return { success: true };
        },
        clearKey: async (provider) => {
          removed.push(provider);
          providers = providers.map((item) =>
            item.id === provider ? { ...item, configured: false } : item,
          );
          return { success: true };
        },
        openApiKeyPage: async (provider) => {
          opened.push(provider.apiKeyUrl);
          return { success: true };
        },
      };
      const click = async (text) => {
        const button = [...document.querySelectorAll("button")].find(
          (button) => button.textContent.trim() === text,
        );
        check(button, `Missing ${text}`);
        await act(async () => button.click());
      };
      try {
        await act(async () =>
          root.render(
            React.createElement(SetupScreen, {
              service,
              onComplete: () => completed++,
              reportError: (error) => {
                throw error;
              },
            }),
          ),
        );
        const input = document.querySelector("input");
        await act(async () => {
          Object.getOwnPropertyDescriptor(
            HTMLInputElement.prototype,
            "value",
          ).set.call(input, "sk-old-draft-123456789012345");
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
        await act(async () => {
          const select = document.querySelector("select");
          select.value = "grok";
          select.dispatchEvent(new Event("change", { bubbles: true }));
        });
        const grokInput = document.querySelector("input");
        check(
          grokInput.value === "",
          "Changing provider retained another provider's key draft",
        );
        check(
          grokInput.labels[0].textContent === "Grok API key",
          "Provider label did not update",
        );
        check(
          grokInput.placeholder === "xai-...",
          "Provider key hint did not update",
        );
        await click("Get a Grok API key");
        check(
          opened[0] === "https://console.x.ai/",
          "Help opened wrong provider",
        );
        await act(async () => {
          Object.getOwnPropertyDescriptor(
            HTMLInputElement.prototype,
            "value",
          ).set.call(grokInput, "xai-new-key-123456789012345");
          grokInput.dispatchEvent(new Event("input", { bubbles: true }));
        });
        await act(async () =>
          document
            .querySelector("form")
            .dispatchEvent(
              new Event("submit", { bubbles: true, cancelable: true }),
            ),
        );
        check(
          configured[0]?.provider === "grok",
          "Submitted key to wrong provider",
        );
        check(
          configured[0]?.key.startsWith("xai-"),
          "Grok key was rejected by an OpenAI prefix check",
        );
        check(
          completed === 0 && document.querySelector('[role="alert"]'),
          "Failed validation left setup",
        );
        await click("Use saved Grok key");
        check(
          selected[0] === "grok" && completed === 1,
          "Saved provider could not be selected",
        );
        await click("Remove saved Grok key");
        check(removed.length === 0, "Removal skipped confirmation");
        await click("Remove Grok key?");
        check(
          removed[0] === "grok" && providers[0].configured,
          "Removal touched the other key",
        );
        check(
          ![...document.querySelectorAll("button")].some((button) =>
            button.textContent.includes("Use saved Grok"),
          ),
          "Removed key still offered",
        );
        const container = document.getElementById("root").firstElementChild;
        check(
          [...container.querySelectorAll("input,select,button")].every(
            (element) =>
              element.getBoundingClientRect().right <=
              container.getBoundingClientRect().right,
          ),
          "Provider setup overflows compact width",
        );
        await act(async () => root.unmount());
        document.getElementById("result").textContent =
          "PASS: Provider setup, validation, saved selection and isolated removal";
      } catch (error) {
        document.getElementById("result").textContent =
          `FAIL: ${error.message}`;
        throw error;
      }
    </script>
  </body>
</html>
