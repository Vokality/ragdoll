<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Web citation regression</title>
  </head>
  <body>
    <p id="result">Running…</p>
    <div id="root" style="width: 400px; height: 400px; display: flex"></div>
    <script type="module">
      import React, { act } from "react";
      import { createRoot } from "react-dom/client";
      import { ConversationBubbles } from "../src/components/conversation-bubbles.tsx";
      import "../src/styles/global.css";
      globalThis.IS_REACT_ACT_ENVIRONMENT = true;
      const root = createRoot(document.getElementById("root"));
      const content = "NASA news.";
      const sources = [
        { title: "NASA", url: "https://www.nasa.gov/" },
        { title: "Unsafe", url: "javascript:alert(1)" },
      ];
      try {
        await act(async () =>
          root.render(
            React.createElement(ConversationBubbles, {
              messages: [{ id: "answer", role: "assistant", content, sources }],
              isStreaming: false,
            }),
          ),
        );
        const link = document.querySelector(".bubble-assistant a");
        if (
          !link ||
          !link.closest(".source-pills") ||
          link.href !== "https://www.nasa.gov/" ||
          link.closest('[aria-hidden="true"]')
        )
          throw new Error("Citation is missing or inaccessible");
        if (document.querySelectorAll(".bubble-assistant a").length !== 1)
          throw new Error("Unsafe URL became a link");
        link.focus();
        if (document.activeElement !== link || link.target !== "_blank")
          throw new Error(
            "Citation is not keyboard accessible or does not use external navigation",
          );
        const favicon = link.querySelector("img");
        if (
          !favicon ||
          favicon.getAttribute("src") !==
            "https://www.google.com/s2/favicons?domain=www.nasa.gov&sz=32" ||
          favicon.referrerPolicy !== "no-referrer"
        )
          throw new Error("Missing site favicon");
        await act(async () => favicon.dispatchEvent(new Event("error")));
        if (link.querySelector("img") || !link.querySelector("svg"))
          throw new Error("Missing favicon fallback");
        await act(async () =>
          root.render(
            React.createElement(ConversationBubbles, {
              messages: [
                {
                  id: "legacy-answer",
                  role: "assistant",
                  content: "Saved news.\nSource: [NASA](https://www.nasa.gov/)",
                },
              ],
              isStreaming: false,
            }),
          ),
        );
        if (
          !document.querySelector(".source-pill") ||
          document
            .querySelector(".bubble-assistant")
            .textContent.includes("Source:")
        )
          throw new Error("Legacy citation was not moved into a pill");
        await act(async () => root.unmount());
        document.getElementById("result").textContent =
          "PASS: clickable accessible citation links, safe URLs, and external navigation";
      } catch (error) {
        document.getElementById("result").textContent = "FAIL: " + error.stack;
      }
    </script>
  </body>
</html>
