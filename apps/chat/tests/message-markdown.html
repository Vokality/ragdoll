<!doctype html><html lang="en"><head><meta charset="utf-8" /><title>Message Markdown</title></head>
<body><p id="result">Running…</p><div id="root" style="width:320px;height:520px;display:flex"></div>
<script type="module">
import React, { act } from "react";
import { createRoot } from "react-dom/client";
import { ConversationBubbles } from "../src/components/conversation-bubbles.tsx";
import "../src/styles/global.css";
globalThis.IS_REACT_ACT_ENVIRONMENT = true;
const root = createRoot(document.getElementById("root"));
const check = (value,message) => { if(!value) throw new Error(message); };
// Flush React between polls; one long act batches animation updates until it ends.
const waitFor = async (predicate, message) => {
 const deadline = performance.now() + 10000;
 while (!predicate()) {
   if (performance.now() >= deadline) throw new Error(message);
   await act(async () => new Promise(resolve => setTimeout(resolve, 50)));
 }
};
const content = '# Heading\n\n**Bold** and *italic*, ~~removed~~ and `code`.\n\n- first\n- second\n\n1. ordered\n2. list\n\n> quote\n\n- [x] done\n- [ ] next\n\n| Name | Value |\n| --- | --- |\n| Row | Cell |\n\n```js\nconst veryLongName = "' + 'x'.repeat(150) + '";\n// [literal](https://example.com)\n```';
const render = (messages,isStreaming=false) => act(async()=>root.render(React.createElement(ConversationBubbles,{messages,isStreaming})));
try {
 await render([{role:"user",content}, {role:"assistant",content,sources:[{title:"Source",url:"https://example.com"}]}]);
 for(const role of ["user","assistant"]) {
   const bubble=document.querySelector(`.bubble-${role}`);
   for(const selector of ["h1","strong","em","del","code","ul","ol","blockquote","table","input:checked","pre"]) check(bubble.querySelector(selector),`${role} missing ${selector}`);
   check(bubble.querySelector("pre").textContent.includes("[literal](https://example.com)"),"Citation processing damaged code");
   check(bubble.querySelector("pre").scrollWidth > bubble.querySelector("pre").clientWidth,"Long code does not scroll");
   check(bubble.getBoundingClientRect().width<=320,"Bubble overflowed narrow chat");
 }
 check(document.querySelector(".source-pills") && !document.querySelector(".message-markdown .source-pills"),"Sources moved inside Markdown");
 const hostile='[safe](https://example.com) [unsafe](javascript:alert%281%29) [local](file:///etc/passwd) [relative](/settings)\n\n<img src=x onerror=alert(1)>\n\n![image](https://example.com/pixel.png)';
 await render([{role:"user",content:hostile}]);
 check(document.querySelector('a[href="https://example.com/"]')?.target==="_blank","Safe link is not external");
 check(!document.querySelector('a[href^="javascript:"],a[href^="file:"],a[href^="/"],img,script:not([type="module"])'),"Untrusted markup created unsafe content");
 await render([{role:"assistant",content:"**Streamed**\n\n```js\nconst x = 1;\n```"}],true);
 await waitFor(()=>document.querySelector(".bubble-assistant strong")?.textContent==="Streamed","Live text is not Markdown");
 check(document.querySelector(".stream-cursor"),"Stream cursor lost");
 await render([{role:"assistant",content:"**Streamed**\n\n```js\nconst x = 1;\n```"}],false);
 await waitFor(()=>document.querySelector(".bubble-assistant pre")?.textContent.includes("const x = 1") && !document.querySelector(".stream-cursor"),"Final code block or completed reveal missing");
 await act(async()=>root.unmount());
 document.getElementById("result").textContent="PASS: both roles, GFM, safe links, literal code, citations, narrow overflow and streamed Markdown";
} catch(error) { document.getElementById("result").textContent=`FAIL: ${error.stack ?? error}`; }
</script></body></html>
