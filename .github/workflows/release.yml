name: Release

# Builds Lumen for macOS, Linux and Windows from a chat-v* tag and publishes the installers
# to a GitHub release. macOS builds are signed with the Vokality Developer ID and notarized
# with an App Store Connect API key; Windows builds are unsigned.

on:
  push:
    tags:
      - "chat-v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Browser regressions
        run: xvfb-run -a bun run test:browser

      - name: Type check
        run: bun run typecheck

      - name: Verify packed packages
        run: bun run verify:packages

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder-args: --mac --arm64 --x64 --config.mac.notarize=true
          - os: ubuntu-latest
            platform: linux
            builder-args: --linux --x64
          - os: windows-latest
            platform: win
            builder-args: --win --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set app version from tag
        working-directory: apps/chat
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bun -e "const pkg = await Bun.file('package.json').json(); pkg.version = process.env.VERSION.replace(/^chat-v/, ''); await Bun.write('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Build
        run: bun run build

      # electron-builder's own keychain import fails under Bun, so the Developer ID identity
      # is imported into the runner's keychain and selected by name.
      - name: Import signing certificate
        if: matrix.platform == 'mac'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write the notarization key
        if: matrix.platform == 'mac'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notarization.p8"

      - name: Package
        working-directory: apps/chat
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/notarization.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            export CSC_NAME="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          bunx --bun --no-install electron-builder ${{ matrix.builder-args }} --publish never

      - name: Remove the notarization key
        if: always() && matrix.platform == 'mac'
        run: rm -f "$RUNNER_TEMP/notarization.p8"

      # electron-builder skips notarizing with only a warning when an input is missing, so
      # each app is checked for the Vokality team signature and a stapled ticket.
      - name: Check each app is signed and notarized
        if: matrix.platform == 'mac'
        working-directory: apps/chat
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for app in release/mac*/Lumen.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            team=$(codesign -dv --verbose=2 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            if [ "$team" != "$APPLE_TEAM_ID" ]; then
              echo "$app is signed by team '$team', not Vokality's" >&2
              exit 1
            fi
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
          path: |
            apps/chat/release/*.dmg
            apps/chat/release/*.zip
            apps/chat/release/*.AppImage
            apps/chat/release/*.deb
            apps/chat/release/*.exe

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lumen-*
          path: release
          merge-multiple: true

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "VERSION=${TAG#chat-v}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumen v${{ steps.version.outputs.VERSION }}
          files: release/*
          draft: false
          prerelease: false
