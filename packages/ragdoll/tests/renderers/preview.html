<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Character model review</title>
    <style>
      body {
        margin: 0;
        background: #e9e7e3;
        color: #35322e;
        font: 14px system-ui;
      }
      header {
        padding: 20px;
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      select,
      button {
        font: inherit;
        padding: 6px;
      }
      #views {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      article {
        text-align: center;
      }
      canvas {
        width: 100%;
        height: 420px;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Character model review</strong>
      <label
        >Variant
        <select id="variant">
          <option>human</option>
          <option>einstein</option>
        </select></label
      >
      <label
        >Theme
        <select id="theme">
          <option>default</option>
          <option>monochrome</option>
          <option>robot</option>
        </select></label
      >
      <label
        >Mood
        <select id="mood">
          <option>neutral</option>
          <option>smile</option>
          <option>laugh</option>
          <option>sad</option>
          <option>angry</option>
          <option>surprise</option>
        </select></label
      >
      <label
        >Pitch <input id="pitch" type="range" min="-40" max="40" value="0"
      /></label>
      <label><input id="blink" type="checkbox" />Closed eyes</label>
    </header>
    <div id="views"></div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
