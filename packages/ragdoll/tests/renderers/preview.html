<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Character model review</title>
    <style>
      body {
        margin: 0;
        background: #e9e7e3;
        color: #35322e;
        font: 14px system-ui;
      }
      header {
        padding: 20px;
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      select,
      button {
        font: inherit;
        padding: 6px;
      }
      #views {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      article {
        text-align: center;
      }
      canvas {
        width: 100%;
        height: 420px;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Character model review</strong>
      <label
        >Variant
        <select id="variant">
          <option>human</option>
          <option>einstein</option>
        </select></label
      >
      <label
        >Theme
        <select id="theme">
          <option>default</option>
          <option>monochrome</option>
          <option>robot</option>
        </select></label
      >
      <label
        >Mood
        <select id="mood">
          <option>neutral</option>
          <option>smile</option>
          <option>laugh</option>
          <option>sad</option>
          <option>angry</option>
          <option>surprise</option>
        </select></label
      >
      <label
        >Pitch <input id="pitch" type="range" min="-40" max="40" value="0"
      /></label>
      <label><input id="blink" type="checkbox" />Closed eyes</label>
    </header>
    <div id="views"></div>
    <script type="module">
      import { CharacterScene } from "../../src/renderers/three/character-scene.ts";
      import { CharacterController } from "../../src/controllers/character-controller.ts";
      import { computeRenderData } from "../../src/components/render-data.ts";
      const controls = Object.fromEntries(
        ["variant", "theme", "mood", "pitch", "blink"].map((id) => [
          id,
          document.getElementById(id),
        ]),
      );
      let controller;
      const views = [-90, -35, 0, 35, 90, 180].map((yaw) => {
        const article = document.createElement("article");
        const label = document.createElement("p");
        label.textContent = `${yaw}°`;
        const canvas = document.createElement("canvas");
        article.append(label, canvas);
        document.getElementById("views").append(article);
        return {
          canvas,
          yaw: (yaw * Math.PI) / 180,
          scene: new CharacterScene(canvas),
        };
      });
      function draw() {
        const data = computeRenderData(controller);
        if (controls.blink.checked) {
          data.expression.leftEye.openness = 0;
          data.expression.rightEye.openness = 0;
        }
        for (const { scene, canvas, yaw } of views) {
          scene.setSize(canvas.clientWidth, canvas.clientHeight);
          scene.setData({
            ...data,
            yaw,
            pitch: (Number(controls.pitch.value) * Math.PI) / 180,
          });
        }
      }
      function reset() {
        controller?.destroy();
        controller = new CharacterController({
          variantId: controls.variant.value,
          themeId: controls.theme.value,
          onEventSubscriberError: console.error,
        });
        controller.setIdleEnabled(false);
        controller.setMood(controls.mood.value, 0.05);
        for (let i = 0; i < 20; i++) controller.update(0.05);
        draw();
      }
      for (const control of Object.values(controls))
        control.addEventListener("input", reset);
      window.addEventListener("resize", draw);
      window.addEventListener("pagehide", () => {
        controller.destroy();
        views.forEach(({ scene }) => scene.dispose());
      });
      reset();
    </script>
  </body>
</html>
