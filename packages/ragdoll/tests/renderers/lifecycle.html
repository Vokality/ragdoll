<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Character lifecycle regression</title>
  </head>
  <body>
    <p id="result">Running…</p>
    <div id="root" style="width: 320px; height: 380px"></div>
    <script type="module">
      import React, { StrictMode } from "react";
      import { createRoot } from "react-dom/client";
      import { flushSync } from "react-dom";
      import { RagdollCharacter } from "../../src/components/ragdoll-character.tsx";
      import { getTheme } from "../../src/themes/index.ts";
      const root = createRoot(document.getElementById("root"));
      const controllers = [];
      const ready = (controller) => controllers.push(controller);
      const reportError = (error) => {
        throw error;
      };
      const render = (variant, theme) =>
        flushSync(() =>
          root.render(
            React.createElement(
              StrictMode,
              null,
              React.createElement(RagdollCharacter, {
                variant,
                theme: getTheme(theme),
                onControllerReady: ready,
                onEventSubscriberError: reportError,
              }),
            ),
          ),
        );
      const check = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      try {
        render("human", "default");
        const human = controllers.at(-1),
          initialCalls = controllers.length;
        check(human, "Controller was not exposed");
        check(
          document.querySelectorAll("canvas").length === 1,
          "StrictMode leaked a canvas",
        );
        render("human", "robot");
        check(
          controllers.length === initialCalls,
          "Theme replacement recreated the controller",
        );
        check(human.getThemeId() === "robot", "Theme did not synchronize");
        render("einstein", "default");
        check(
          controllers.at(-1) !== human,
          "Variant replacement reused the old controller",
        );
        check(
          controllers.at(-1).getGeometry().variant.id === "einstein",
          "Variant did not synchronize",
        );
        check(
          document.querySelectorAll("canvas").length === 1,
          "Variant replacement leaked a canvas",
        );
        root.unmount();
        check(
          document.querySelectorAll("canvas").length === 0,
          "Unmount leaked a canvas",
        );
        document.getElementById("result").textContent =
          "PASS: StrictMode, theme update, variant replacement, and unmount";
      } catch (error) {
        document.getElementById("result").textContent =
          `FAIL: ${error.message}`;
        throw error;
      }
    </script>
  </body>
</html>
